
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>


    <section>
        <h2>саисок справ</h2>

        <input type="text" id="taskInput" placeholder="введіть справу">
        <button id="taskBtn">додати</button>

        <ul id="taskList"></ul>

        <p>один клік - виконати справу, подвійний - видалити</p>
    </section>

    <section>
        <h2>лампочка</h2>

        <div id="bulb">💡</div>
        <button id="bulbBtn">увімкнути</button>
    </section>

    <section>
        <h2>реєстрація</h2>

        <form id="regForm">
            <input type="text" id="userName" placeholder="ваше ім'я">
            <input type="password" id="userPass" placeholder="ваш пароль">
            <button type="submit">зареєструватися</button>
        </form>

        <p id="regMessage"></p>
    </section>

    <section>
        <h2>рух квадрата</h2>

        <div id="mover"></div>

        <p>використовуйте стрілки на клавіатурі </p>
    </section>

    <script src="script.js"></script>
</body>
</html>
